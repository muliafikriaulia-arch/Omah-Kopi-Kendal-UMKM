  <main id="konten-utama" class="page">

    <section class="gallery-section" aria-labelledby="galeri-title">
      <h1 id="galeri-title">Galeri Omah Kopi Kendal</h1>

      <p>
        Galeri ini menampilkan produk dan aktivitas Omah Kopi Kendal.
      </p>

      <div class="gallery-grid">

        <figure class="gallery-card">
          <img
            src="assets/images/kopi-robusta-okk.jpg"
            alt="Kopi Robusta Kendal dalam gelas saji"
          />
          <figcaption>Kopi Robusta Kendal dengan cita rasa khasnya.</figcaption>
        </figure>

        <figure class="gallery-card">
          <img
            src="assets/images/kopi-tubruk-okk.jpg"
            alt="Kopi Tubruk Signature yang siap disajikan"
          />
          <figcaption>Kopi Tubruk Signature dengan cita rasa khasnya.</figcaption>
        </figure>

         <figure class="gallery-card">
          <img
            src="assets/images/cold-brew-aren-okk.jpg"
            alt="Cold Brew Aren yang siap disajikan"
          />
          <figcaption>Cold Brew Aren dengan cita rasa khasnya.</figcaption>
        </figure>

         <figure class="gallery-card">
          <img
            src="assets/images/kopi-arabica-okk.jpg"
            alt="Kopi Arabica Kendal yang siap disajikan"
          />
          <figcaption>Kopi Arabica Kendal dengan cita rasa khasnya.</figcaption>
        </figure>

        <figure class="gallery-card">
          <img
            src="assets/images/proses-kopi-okk.jpg"
            alt="Proses pembuatan kopi di Kopi Omah Kendal"
          />
          <figcaption>Proses pembuatan dan penyajian kopi.</figcaption>
        </figure>

        <figure class="gallery-card">
          <img
            src="assets/images/tim-okk.jpg"
            alt="Tim Omah Kopi Kendal dalam kegiatan UMKM"
          />
          <figcaption>Tim Omah Kopi Kendal dalam kegiatan usaha.</figcaption>
        </figure>

      </div>

        Dengarkan lagu Omah Kopi Kendal.
